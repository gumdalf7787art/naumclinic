  <body>
    <div id="root"></div>
    <div id="error-log" style="color: red; padding: 20px; font-family: monospace; white-space: pre-wrap;"></div>
    <script>
      window.addEventListener('error', function(e) {
        document.getElementById('error-log').innerText += e.message + '\\n' + (e.error && e.error.stack ? e.error.stack : '') + '\\n';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.getElementById('error-log').innerText += 'Unhandled Rejection: ' + e.reason + '\\n';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
